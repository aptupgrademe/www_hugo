---
# =============================================================================
# Role: common_selinux
# Purpose: SELinux enforcing with the targeted policy. nginx runs in httpd_t, the
#          site is labelled by blog_web, the monitoring has its own domains
#          (common_selinux_monitoring).
# =============================================================================
- name: SELinux | Ensure SELinux tools are installed (semanage/restorecon)
  ansible.builtin.dnf:
    name:
      - policycoreutils
      - policycoreutils-python-utils
      - selinux-policy-targeted
    state: present

- name: SELinux | Ensure SELinux is enforcing (targeted policy)
  ansible.posix.selinux:
    policy: targeted
    state: enforcing
