---
# =============================================================================
# Role: common_fail2ban
# Purpose: Ban abusive IPs via Fail2Ban + nftables.
#
# Five jails (templates/jail.local.j2): sshd, Grafana login, scanners, bad
# paths, and recidive (repeat offenders get a long ban). The HTTP jails read
# nginx's access log.
# =============================================================================
#
# How it works:
#   1. install fail2ban (EPEL)
#   2. templates: a custom ban ACTION (puts IPs into the nftables sets
#      banned4/banned6 that common_firewall created), three FILTERS (regexes
#      that recognise an attack in a log line) and jail.local (which filter
#      watches which log, how many hits within findtime lead to a ban)
#   3. start the service
#
# Ansible concepts used here:
#   template + notify   any changed config file -> one fail2ban restart
#                       at the end of the play
#   file state: touch + modification_time/access_time: preserve
#                       creates an empty file if missing, but does NOT
#                       bump the timestamps of an existing one - otherwise
#                       "touch" would report "changed" on every run
#   loop over dicts + loop_control.label   each item is a dict (name +
#                       content); "label" shows only the name in the output
#                       instead of the whole unit file text


# -----------------------------------------------------------------------------
# Package  (fail2ban is in EPEL)
# -----------------------------------------------------------------------------
# exclude: on AlmaLinux 10 a weak dependency pulls kernel-modules-extra, and the
# SSH session sandbox masks /usr/lib/modules, so dnf reports "no space". Kernels
# stay the job of dnf-automatic (see blog_packages).
- name: Fail2Ban | Install package
  ansible.builtin.dnf:
    name: fail2ban
    exclude: kernel*
    install_weak_deps: false
    state: present


# -----------------------------------------------------------------------------
# Configuration
# -----------------------------------------------------------------------------
- name: Fail2Ban | Deploy nftables ban action (one f2b_<jail>4/6 set pair per jail)
  ansible.builtin.template:
    src: nftables-banned-sets.conf.j2
    dest: /etc/fail2ban/action.d/nftables-banned-sets.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart fail2ban

- name: Fail2Ban | Deploy nginx filters
  ansible.builtin.template:
    src: "filter.d/{{ item }}.j2"
    dest: "/etc/fail2ban/filter.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - nginx-grafana-login.conf
    - nginx-scanner.conf
    - nginx-bad-paths.conf
  notify: restart fail2ban

- name: Fail2Ban | Deploy jail.local
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: restart fail2ban


# -----------------------------------------------------------------------------
# Service
# -----------------------------------------------------------------------------
# On a genuinely fresh host, fail2ban's own log file doesn't exist yet. The
# recidive jail (jail.local) reads it (logpath = /var/log/fail2ban.log), and
# fail2ban parses all jail configs *before* its own logger creates that file
# on first start – so on a first-ever start this fails immediately with
# "Have not found any log file for recidive jail" (exit-code 255, service
# never comes up). Pre-creating the file avoids the chicken-and-egg race.
- name: Fail2Ban | Ensure fail2ban.log exists (needed by recidive jail on first-ever start)
  ansible.builtin.file:
    path: /var/log/fail2ban.log
    state: touch
    owner: root
    group: root
    mode: "0640"
    modification_time: preserve
    access_time: preserve

- name: Fail2Ban | Enable and start service
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
    daemon_reload: true
