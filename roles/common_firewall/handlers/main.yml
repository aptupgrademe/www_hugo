---
# Handlers of common_firewall.
# listen: a handler can subscribe to a TOPIC instead of being called by its
# own name. Both handlers here react to "Reload nftables" - the first one
# because that is its name, the second via "listen: Reload nftables". One
# notify triggers both, in the order they are defined in this file.

- name: Reload nftables
  ansible.builtin.service:
    name: nftables
    state: reloaded

# The reload replaces the whole "inet filter" table (fw.nft.j2: delete +
# recreate), and with it the ban sets banned4/banned6 that fail2ban fills.
# fail2ban does not notice: it keeps the IPs as "banned" while the firewall
# lets them in again. Found 2026-09-30: after a playbook run, 32 of 41 bans on
# two hosts existed only in fail2ban. A restart makes
# fail2ban re-apply every still-active ban from its database. try-restart:
# does nothing where fail2ban is not running. Runs after the reload because
# handlers execute in the order they are defined here. On a fresh host the unit
# does not exist yet (the reload happens before common_fail2ban) and systemctl
# exits with 5, which stopped the first run (found 2026-11-06).
- name: Re-apply fail2ban bans after the nftables reload
  ansible.builtin.command: systemctl try-restart fail2ban
  listen: Reload nftables
  register: _fw_f2b_restart
  changed_when: _fw_f2b_restart.rc == 0
  failed_when: _fw_f2b_restart.rc not in [0, 5]
