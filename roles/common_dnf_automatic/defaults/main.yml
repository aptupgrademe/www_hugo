---
# Passed to the reboot-required check below; uses the host's 'email' variable
# from vault (same pattern as rkhunter_mail in common_rkhunter).
# Override if a separate monitoring address is desired:
# dnf_automatic_reboot_mail: "monitoring@example.com"
#
# defaults/ = lowest-priority role variables.

dnf_automatic_reboot_mail: "{{ email }}"

# Repo ids whose updates are applied in full at 02:15 (update-vendor-repos):
# vendor repositories without security metadata, which upgrade_type = security
# never touches. Empty = no job.
dnf_automatic_vendor_repos: []
