---
# Part 2 of blog_verify: judge, report, mail, assert.
- name: Verify | Compute results
  ansible.builtin.set_fact:
    _codes: "{{ dict(_v_paths.results | map(attribute='item') | zip(_v_paths.results | map(attribute='stdout'))) }}"
    _site_ports: "{{ (_v_ports.stdout | default('') | trim).split() }}"

- name: Verify | Build the check list
  ansible.builtin.set_fact:
    _checks:
      - ['nftables service', "{{ _v_nft_svc.stdout | default('') == 'active' }}", "{{ _v_nft_svc.stdout | default('?') }}"]
      - ['nftables inet filter', "{{ 'inet filter' in (_v_nft_tables.stdout | default('')) }}", '']
      - ['nftables policy drop', "{{ (_v_nft_policy.stdout | default('0') | trim | int) > 0 }}", '']
      - ['fail2ban sets', "{{ (_v_nft_f2b_sets.stdout | default('0') | trim | int) == (fail2ban_nft_jails | length) * 2 }}", "{{ _v_nft_f2b_sets.stdout | default('?') }}"]
      - ['fail2ban ban chain', "{{ (_v_f2b_effect.stdout_lines | default([]) | last | default('')) == 'RESULT 0' }}", "{{ _v_f2b_effect.stdout_lines | default([]) | reject('match', '.* ok$') | join('; ') }}"]
      - ['fail2ban service', "{{ _v_f2b_svc.stdout | default('') == 'active' }}", '']
      - ['nginx service', "{{ _v_nginx_svc.stdout | default('') == 'active' }}", '']
      - ['auditd service', "{{ _v_auditd_svc.stdout | default('') == 'active' }}", '']
      - ['SELinux enforcing', "{{ _v_selinux.stdout | default('') == 'Enforcing' }}", "{{ _v_selinux.stdout | default('?') }}"]
      - ['daemons in their own domain', "{{ (_v_daemon_domains.stdout | default('?') | trim) == '' }}", "{{ _v_daemon_domains.stdout | default('?') | trim }}"]
      - ['TCP BBR', "{{ (_v_bbr.stdout | default('') | trim) == 'bbr' }}", '']
      - ['monitoring data and rules', "{{ (_v_data_presence.stdout_lines | default([]) | last | default('')) == 'RESULT 0' }}", "{{ _v_data_presence.stdout_lines | default([]) | select('match', 'FAIL') | join('; ') }}"]
      - ['site answers 200', "{{ _codes['/'] == '200' }}", "{{ _codes['/'] }}"]
      - ['unknown page 404', "{{ _codes['/no-such-page-at-all/'] == '404' }}", "{{ _codes['/no-such-page-at-all/'] }}"]
      - ['no PHP executed', "{{ _codes['/index.php'] == '404' }}", "{{ _codes['/index.php'] }}"]
      - ['no WordPress login', "{{ _codes['/wp-login.php'] == '404' }}", "{{ _codes['/wp-login.php'] }}"]
      - ['hidden files blocked', "{{ _codes['/.git/config'] == '404' }}", "{{ _codes['/.git/config'] }}"]
      - ['/.env blocked', "{{ _v_env.stdout | default('200') | trim | int in [403, 404] }}", "{{ _v_env.stdout | default('?') }}"]
      - ['old feed redirects', "{{ _codes['/feed/'] == '301' }}", "{{ _codes['/feed/'] }}"]
      - ['Grafana reachable', "{{ _codes['/grafana/login'] == '200' }}", "{{ _codes['/grafana/login'] }}"]
      - ['port 80 redirects', "{{ (_v_http80.stdout | default('')).startswith('301') }}", "{{ _v_http80.stdout | default('?') }}"]
      - ['HSTS header', "{{ 'strict-transport-security' in (_v_headers.stdout | default('')) }}", '']
      - ['nginx version hidden', "{{ 'nginx/' not in (_v_headers.stdout | default('')) }}", '']
      - ['no PHP, K3s or database installed', "{{ (_v_absent.stdout | default('x') | trim) == '' }}", "{{ _v_absent.stdout | default('?') | trim }}"]
      - ['nginx egress blocked', "{{ (_v_egress.stdout | default('') | trim) == 'blocked' }}", "{{ _v_egress.stdout | default('?') | trim }}"]
      - ['only 80, 443 and SSH public', "{{ _site_ports | difference(['80', '443', ansible_port | string, '10022']) | length == 0 }}", "{{ _site_ports | join(' ') }}"]
      - ['certificate served', "{{ 'notAfter' in (_v_cert.stdout | default('')) }}", "{{ _v_cert.stdout | default('?') | replace('\n', ' ') }}"]

- name: Verify | Report
  ansible.builtin.debug:
    msg: "{{ _checks | map('join', ' | ') | list }}"

- name: Verify | Names of the failed checks
  ansible.builtin.set_fact:
    _failed_checks_list: "{{ _checks | rejectattr('1', 'equalto', true) | rejectattr('1', 'equalto', 'True') | map('first') | list }}"

- name: Verify | Mail the result
  ansible.builtin.shell: |
    set -o pipefail
    printf 'Subject: [{{ inventory_hostname }}] blog deploy verified: {{ _checks | length - _failed_checks_list | length }}/{{ _checks | length }} ok\n\nFailed: {{ _failed_checks_list | join(", ") | default("none", true) }}\n' \
      | /usr/sbin/sendmail {{ email }}
  changed_when: false
  failed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Verify | All checks passed?
  ansible.builtin.assert:
    that: _failed_checks_list | length == 0
    quiet: true
    fail_msg: "Failed checks: {{ _failed_checks_list | join(', ') }}"
    success_msg: "All {{ _checks | length }} checks passed."
