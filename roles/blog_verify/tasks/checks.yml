---
# Part 1 of blog_verify: collect. Every check only reads; report.yml judges.
- name: Verify | Shared host checks (common_verify)
  ansible.builtin.import_role:
    name: common_verify
    tasks_from: host.yml

- name: Verify | Shared http checks (common_verify)
  ansible.builtin.import_role:
    name: common_verify
    tasks_from: http.yml
  vars:
    verify_url: "https://{{ blog_web_tls_names[0] }}"
    verify_hostname: "{{ blog_web_tls_names[0] }}"

# Everything below goes to 127.0.0.1: probing bad paths from outside would get
# the machine running the playbook banned by fail2ban.
- name: Verify | HTTP status of paths
  ansible.builtin.shell: |
    curl -sk --max-time 15 --resolve "{{ blog_web_tls_names[0] }}:443:127.0.0.1" -o /dev/null -w "%{http_code}" \
      "https://{{ blog_web_tls_names[0] }}{{ item }}" 2>/dev/null || echo 000
  loop: [/, /no-such-page-at-all/, /index.php, /wp-login.php, /.git/config, /feed/, /grafana/login]
  register: _v_paths
  changed_when: false
  check_mode: false
  failed_when: false

- name: Verify | Port 80 redirects to HTTPS
  ansible.builtin.shell: |
    curl -s --max-time 15 -H "Host: {{ blog_web_tls_names[0] }}" -o /dev/null -w "%{http_code} %{redirect_url}" http://127.0.0.1/ 2>/dev/null || echo 000
  register: _v_http80
  changed_when: false
  check_mode: false
  failed_when: false

- name: Verify | Software that must not exist on this host
  ansible.builtin.shell: |
    for c in php php-fpm k3s kubectl mariadbd redis-server; do command -v "$c" >/dev/null 2>&1 && echo "$c"; done; true
  register: _v_absent
  changed_when: false
  check_mode: false
  failed_when: false

# A connection attempt as the nginx user must be dropped by the firewall.
- name: Verify | nginx may not connect to the outside
  ansible.builtin.shell: |
    runuser -u nginx -- bash -c 'timeout 5 bash -c "exec 3<>/dev/tcp/1.1.1.1/443" 2>/dev/null && echo open || echo blocked'
  register: _v_egress
  changed_when: false
  check_mode: false
  failed_when: false

- name: Verify | Sandbox of nginx active
  ansible.builtin.command: systemctl show nginx -p MemoryMax -p ProtectHome -p NRestarts
  register: _v_nginx_props
  changed_when: false
  check_mode: false
  failed_when: false

- name: Verify | Only the expected ports listen publicly
  ansible.builtin.shell: |
    set -o pipefail
    ss -H -ltn | awk '{print $4}' | grep -vE '^(127\.0\.0\.1|\[::1\]):' | sed -E 's/.*:([0-9]+)$/\1/' | sort -un | tr '\n' ' '
  register: _v_ports
  changed_when: false
  check_mode: false
  failed_when: false

- name: Verify | Certificate served
  ansible.builtin.shell: |
    set -o pipefail
    echo | openssl s_client -connect 127.0.0.1:443 -servername "{{ blog_web_tls_names[0] }}" 2>/dev/null | openssl x509 -noout -issuer -enddate
  register: _v_cert
  changed_when: false
  check_mode: false
  failed_when: false
