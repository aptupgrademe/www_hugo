---
- name: Reload nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded

- name: Restart nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: restarted
    daemon_reload: true

- name: Restart nginx exporter
  ansible.builtin.systemd_service:
    name: nginx_exporter
    state: restarted
    daemon_reload: true
