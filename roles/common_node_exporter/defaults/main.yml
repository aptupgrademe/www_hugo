---
# node_exporter_version is pinned in inventory/group_vars/all/versions.yml
# (one place for all versions - no second, stale default here).

# systemd services of periodic jobs that report a heartbeat (tasks/main.yml).
# max_age: about twice the interval, so one late run is not an alert.
# sandboxed: the unit has ProtectSystem=strict - the drop-in then also opens
# the textfile directory, or heartbeat-mark fails on a read-only file system.
heartbeat_units:
  - {unit: ssh-login-alert.service,           task: ssh_login_alert,   max_age: 900}
  - {unit: ssh-geo-update.service,            task: ssh_geo_update,    max_age: 691200}
  - {unit: dnf-automatic-install.service,     task: dnf_automatic,     max_age: 108000}
  - {unit: visitor-stats-daily.service,       task: visitor_stats,     max_age: 108000, sandboxed: true}
