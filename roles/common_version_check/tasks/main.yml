---
# =============================================================================
# Role: common_version_check
# Purpose: Pre-flight report: pinned versions against the newest upstream
#          releases. It only informs; deciding on a bump stays manual
#          (inventory/group_vars/all/versions.yml).
# =============================================================================
- name: Versions | Latest upstream releases
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ item.repo }}/releases/latest"
    headers:
      Accept: application/vnd.github+json
    return_content: false
    timeout: 15
  loop:
    - {name: node_exporter, repo: prometheus/node_exporter, want: "{{ node_exporter_version }}"}
    - {name: Prometheus, repo: prometheus/prometheus, want: "{{ prometheus_version }}"}
    - {name: nginx exporter, repo: nginx/nginx-prometheus-exporter, want: "{{ nginx_exporter_version }}"}
    - {name: Loki, repo: grafana/loki, want: "{{ loki_version }}"}
    - {name: Alloy, repo: grafana/alloy, want: "{{ alloy_version }}"}
  loop_control:
    label: "{{ item.name }}"
  register: _vc_latest
  check_mode: false
  failed_when: false
  changed_when: false
  delegate_to: localhost
  become: false

- name: Versions | Report
  ansible.builtin.debug:
    msg: >-
      {{ _vc_latest.results | map(attribute='item.name') | zip(
         _vc_latest.results | map(attribute='item.want'),
         _vc_latest.results | map(attribute='json.tag_name', default='?')) | map('join', ': ') | list }}
