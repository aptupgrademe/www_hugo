---
# =============================================================================
# Role: common_version_active
# Purpose: Last check of a run: is every pin from versions.yml really running,
#          and is a reboot or a service restart outstanding? Reports only what
#          is not as it should be, and never fails the run.
# =============================================================================
- name: Active versions | Exporter metrics
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ item.port }}/metrics"
    return_content: true
    timeout: 10
  loop:
    - {name: node_exporter, port: 9100, want: "{{ node_exporter_version }}"}
    - {name: Prometheus, port: 9090, want: "{{ prometheus_version }}"}
    - {name: nginx exporter, port: 9113, want: "{{ nginx_exporter_version }}"}
    - {name: Loki, port: 3100, want: "{{ loki_version }}"}
    - {name: Alloy, port: 12345, want: "v{{ alloy_version }}"}
  loop_control:
    label: "{{ item.name }}"
  register: _va_metrics
  check_mode: false
  failed_when: false

- name: Active versions | Reboot pending?
  ansible.builtin.command: needs-restarting -r
  register: _va_reboot
  changed_when: false
  check_mode: false
  failed_when: false

- name: Active versions | Services running replaced code
  ansible.builtin.command: needs-restarting -s
  register: _va_services
  changed_when: false
  check_mode: false
  failed_when: false

- name: Active versions | Compare
  ansible.builtin.set_fact:
    _va_wrong: "{{ _va_wrong | default([]) + [item.item.name ~ ' (want ' ~ item.item.want ~ ')'] }}"
  loop: "{{ _va_metrics.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: ('version="' ~ item.item.want ~ '"') not in (item.content | default(''))
        and ('version="v' ~ item.item.want ~ '"') not in (item.content | default(''))

- name: Active versions | Report
  ansible.builtin.debug:
    msg:
      not_on_pinned_version: "{{ _va_wrong | default([]) }}"
      reboot_pending: "{{ _va_reboot.rc | default(0) == 1 }}"
      services_on_old_code: "{{ _va_services.stdout_lines | default([]) }}"
