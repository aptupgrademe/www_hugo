---
# Ansible Galaxy collections required by this project.
# Install before running any playbook:
#   ansible-galaxy collection install -r requirements.yml
#
# Used by:
#   community.general → common_grafana, ...  (ini_file, modprobe, sefcontext)
#   ansible.posix    → common_selinux        (seboolean, selinux)
#                      common_cis_hardening  (mount - the nodev/nosuid/noexec
#                                             bind mounts on /tmp and /var/tmp)
#
# Note: the selinux module is written as ansible.posix.selinux on purpose.
# ansible-core still redirects a bare "ansible.builtin.selinux" here, so the
# wrong name appears to work as long as this collection happens to be present -
# which hides the dependency until the redirect is removed.

#
# Exact versions, not ranges: ">=" let a new major release in silently on the
# next install (a new major version may break modules by semver), so two
# controllers could run the same playbook with different module code. Bump
# deliberately, read the collection's changelog, then re-run --check --diff.
# ansible-galaxy installs into ~/.ansible/collections, which takes precedence
# over the older copies bundled with the distro's ansible package.

collections:
  - name: ansible.posix
    version: "2.1.0"
  - name: community.general
    version: "11.2.1"
