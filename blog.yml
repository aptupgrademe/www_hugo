---
# =============================================================================
# Playbook: blog.yml
# Provisions the static blog on a fresh AlmaLinux 10 server.
#
# QUICK START – first-time setup on a new host
# -----------------------------------------------------------------------------
# 1. Add the host to the 'blog' group in inventory/hosts.yml (topology only -
#    the address goes into host_vars, see 2.).
#
# 2. Fill in host_vars:
#    inventory/host_vars/<host>/vars.yml   – server_ipv4/6, hostnames, paths
#    inventory/host_vars/<host>/vault.yml  – passwords (see template for keys)
#    Encrypt the vault before committing:
#      ansible-vault encrypt inventory/host_vars/<host>/vault.yml
#
# 3. Ensure ansible_port is set to 22 in vars.yml (fresh server default).
#
# 4. Run the playbook:
#      ansible-playbook blog.yml --limit <host> --vault-password-file .vault_pass
#    The first run reboots the server by itself once SSH and the firewall are
#    configured (common_firewall/tasks/first_run_reboot.yml), reconnects on
#    port 10022 and finishes the run there.
#
# 5. Change ansible_port from 22 to 10022 in vars.yml - the switch in step 4
#    only lasts for that one run (the play prints a reminder at the end).
#    Then reboot once more: psi=1 for the Pressure panel only takes effect at boot.
#
# Usage:
# -----------------------------------------------------------------------------
#
#   # First-time setup (fresh server, ansible_port: 22) and every later run:
#   ansible-playbook blog.yml --limit <host> --vault-password-file .vault_pass
#
#   # Specific host examples:
#   ansible-playbook blog.yml --limit test           --vault-password-file .vault_pass
#   ansible-playbook blog.yml --limit www.example.de --vault-password-file .vault_pass
#
#   # Only one role (every role has a tag with its own name):
#   ansible-playbook blog.yml --limit <host> --tags blog_packages --vault-password-file .vault_pass
#
#   # Dry run - show what would change, change nothing:
#   ansible-playbook blog.yml --limit <host> --check --diff --vault-password-file .vault_pass
#
# Prerequisites:
#   1. cp inventory/hosts.yml.example           inventory/hosts.yml
#   2. cp inventory/host_vars/<h>/vars.yml.example  .../vars.yml  → fill in
#   3. cp inventory/host_vars/<h>/vault.yml.example .../vault.yml → fill in
#   4. ansible-vault encrypt inventory/host_vars/<host>/vault.yml
#
# ADDING A NEW BLOG HOST
# -----------------------------------------------------------------------------
# 1. Add the host under the 'blog' group in inventory/hosts.yml
# 2. Copy inventory/host_vars/test/vars.yml.example → host_vars/<host>/vars.yml
# 3. Copy inventory/host_vars/test/vault.yml.example → host_vars/<host>/vault.yml
# 4. Fill in vars.yml (IPs, hostname) and vault.yml (passwords)
# 5. Follow the Quick Start steps above.
# =============================================================================
- name: Install and configure the static blog
  hosts: blog
  gather_facts: true
  gather_subset:
    - min
  become: false

  roles:
    - { role: common_version_check, tags: [common_version_check] }
    - { role: blog_packages,        tags: [blog_packages] }
    - { role: common_ssh,           tags: [common_ssh] }
    - { role: common_firewall,      tags: [common_firewall] }
    - { role: common_sysctl,        tags: [common_sysctl] }
    - { role: common_cis_hardening, tags: [common_cis_hardening] }
    - { role: common_selinux,       tags: [common_selinux] }
    - { role: blog_web,             tags: [blog_web] }
    - { role: common_node_exporter, tags: [common_node_exporter] }
    - { role: common_prometheus,    tags: [common_prometheus] }
    - { role: common_grafana,       tags: [common_grafana] }
    - { role: common_loki,          tags: [common_loki] }
    - { role: common_fail2ban,      tags: [common_fail2ban] }
    - { role: common_msmtp,         tags: [common_msmtp] }
    - { role: common_dnf_automatic, tags: [common_dnf_automatic] }
    - { role: common_rkhunter,      tags: [common_rkhunter] }
    - { role: blog_visitor_stats,   tags: [blog_visitor_stats] }
    - { role: common_auditd,        tags: [common_auditd] }
    - { role: common_logrotate,     tags: [common_logrotate] }
    - { role: common_monit,         tags: [common_monit] }
    - { role: common_selinux_monitoring, tags: [common_selinux_monitoring] }
    - { role: blog_verify,          tags: [blog_verify] }
    - { role: common_version_active, tags: [common_version_active] }

    # Always last: refresh the AIDE baseline if this run changed anything it
    # watches, so the next AIDE check is not a false alarm about this run.
    - { role: common_aide_refresh,  tags: [common_aide_refresh] }
